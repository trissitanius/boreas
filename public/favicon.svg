<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Boreas mark, flat version for small sizes: a weight plate (Frozen ring) with an Ember core,
       carried by three streaks of north wind. The app icons are the 3D render of the same mark
       (see tools/render-icons.ts). -->
  <defs>
    <linearGradient id="wind" gradientUnits="userSpaceOnUse" x1="30" y1="0" x2="190" y2="0">
      <stop offset="0" stop-color="#A0BDDB" stop-opacity="0"/>
      <stop offset="0.7" stop-color="#A0BDDB"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="#080813"/>
  <g fill="none" stroke="url(#wind)" stroke-width="30" stroke-linecap="round">
    <path d="M84 180 H186"/>
    <path d="M36 256 H164"/>
    <path d="M108 332 H186"/>
  </g>
  <circle cx="326" cy="256" r="134" fill="none" stroke="#A0BDDB" stroke-width="32"/>
  <circle cx="326" cy="256" r="64" fill="none" stroke="#A0BDDB" stroke-opacity="0.45" stroke-width="12"/>
  <circle cx="326" cy="256" r="30" fill="#FF7A45"/>
</svg>
